name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Edge Functions check + scoring parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/kyc-check/index.ts supabase/functions/process-application/index.ts
      - run: deno test supabase/functions/_shared/

  neon:
    name: Neon function typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: neon/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
